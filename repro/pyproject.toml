[project]
name = "neurips-repro"
version = "0.1.0"
description = "Reproducibility code for NeurIPS submission: synthetic letter-sequence benchmark for sequence models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "transformers>=4.47.0",
    "peft>=0.19.0",
    "accelerate>=0.25.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
